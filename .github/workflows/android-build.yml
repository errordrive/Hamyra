name: StreamFlix 2.1 - Android Cloud Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package StreamFlix APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Build-Tools & Apktool
        run: |
          # Add latest pre-installed Android build-tools to PATH
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH

          # Download and configure Apktool v2.10.0
          sudo curl -sL "https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar" -o /usr/local/bin/apktool.jar
          sudo chmod 644 /usr/local/bin/apktool.jar
          printf '#!/bin/bash\nexec java -jar /usr/local/bin/apktool.jar "$@"\n' | sudo tee /usr/local/bin/apktool > /dev/null
          sudo chmod +x /usr/local/bin/apktool

          echo "Apktool version:"
          apktool --version

      - name: Build StreamFlix APK with AAPT2
        run: |
          mkdir -p build/unsigned
          mkdir -p build/aligned
          mkdir -p artifacts
          
          # Build APK using aapt2
          apktool b --use-aapt2 apktool_project -o build/unsigned/StreamFlix-2.1-unsigned.apk
          
          # Align APK
          zipalign -v -p 4 build/unsigned/StreamFlix-2.1-unsigned.apk build/aligned/StreamFlix-2.1-aligned.apk

      - name: Generate Keystore & Sign Release APK
        run: |
          # Create release keystore
          keytool -genkeypair -v \
            -keystore streamflix.keystore \
            -alias streamflix \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass streamflix123 \
            -keypass streamflix123 \
            -dname "CN=StreamFlix, OU=Mobile, O=StreamFlixApp, L=Dhaka, ST=Dhaka, C=BD"

          # Sign release APK with explicit v1, v2, v3 schemes for 100% Android device compatibility
          apksigner sign \
            --ks streamflix.keystore \
            --ks-key-alias streamflix \
            --ks-pass pass:streamflix123 \
            --key-pass pass:streamflix123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --min-sdk-version 21 \
            --out artifacts/StreamFlix-v2.1.apk \
            build/aligned/StreamFlix-2.1-aligned.apk

          # Verify signatures across all SDK levels
          echo "=== APK Signature Verification (SDK 21+) ==="
          apksigner verify --verbose --min-sdk-version 21 artifacts/StreamFlix-v2.1.apk

      - name: Generate Checksums
        run: |
          cd artifacts
          sha256sum StreamFlix-v2.1.apk > checksums.txt
          cat checksums.txt

      - name: Upload StreamFlix APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamFlix-v2.1-apk
          path: artifacts/StreamFlix-v2.1.apk
          retention-days: 30

      - name: Upload Checksums Artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: artifacts/checksums.txt
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1
          name: "StreamFlix v2.1 Release"
          body: |
            ### StreamFlix 2.1 Release Build
            - **Renamed:** Updated app name to **StreamFlix**
            - **Compatibility & Parse Fix:** Min SDK 21, Target SDK 34, native lib extraction enabled, dual v1+v2+v3 signature scheme
            - **Live Primary Worker:** `https://hamyra-api.hamyra.workers.dev`
            - **Live Stream Proxy:** `https://streambd-proxy.hamyra.workers.dev`
            - **New Features:** LibVLC media player, DownloadService offline downloader, 4K HD Hub, BnSubApi, and Hindi Dub Anime rail.
          files: |
            artifacts/StreamFlix-v2.1.apk
            artifacts/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
